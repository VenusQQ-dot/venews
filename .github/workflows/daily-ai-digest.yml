name: Daily AI Digest

on:
  schedule:
    # 22:47 UTC = 早上 06:47 台北時間（UTC+8）。
    # GitHub 排程是「盡力而為」：整點/半點等熱門時刻容易被延遲甚至跳過，
    # 故選冷門分鐘並提早排程，預留延遲緩衝，讓信件仍能在早上送達。
    - cron: "47 22 * * *"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install digest dependencies
        run: npm install --no-save --no-package-lock rss-parser nodemailer @anthropic-ai/sdk

      - name: Build and send digest
        run: node scripts/daily-ai-digest.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}

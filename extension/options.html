<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Wortschatz 設定</title>
  <style>
    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      max-width: 560px; margin: 40px auto; padding: 0 20px;
      color: #1a1a2e; line-height: 1.6;
    }
    h1 { font-size: 22px; }
    label { display: block; margin-top: 20px; font-weight: 600; }
    .hint { font-size: 13px; color: #777; margin-top: 4px; }
    input[type="password"], input[type="text"], select {
      width: 100%; padding: 8px 10px; margin-top: 6px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
    }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input { flex: 1; }
    button {
      padding: 8px 18px; border: none; border-radius: 8px;
      background: #1a1a2e; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #30305a; }
    button.secondary { background: #eee; color: #333; }
    #save { margin-top: 24px; }
    #status { margin-left: 10px; color: #2a7a2a; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Wortschatz — 德文學習助手 設定</h1>

  <label for="api-key">Claude API key</label>
  <div class="key-row">
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
    <button type="button" class="secondary" id="toggle-key">顯示</button>
  </div>
  <div class="hint">
    金鑰只儲存在這台電腦的瀏覽器中(chrome.storage.local),只會用於直接呼叫
    Anthropic API。可至
    <a href="https://platform.claude.com/" target="_blank" rel="noreferrer">platform.claude.com</a>
    取得。
  </div>

  <label for="model">模型</label>
  <select id="model">
    <option value="claude-opus-4-8">Claude Opus 4.8(預設,品質最佳)</option>
    <option value="claude-sonnet-4-6">Claude Sonnet 4.6(較快、較省)</option>
    <option value="claude-haiku-4-5">Claude Haiku 4.5(最快、最省)</option>
  </select>
  <div class="hint">每次解釋都會呼叫一次 API,費用依所選模型計價。</div>

  <button id="save">儲存設定</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>

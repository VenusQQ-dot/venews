<!doctype html>
<!--
  v1 · 直式流程版
  主題：VeNews AI 新聞編輯部
  事實來源（皆為本 repo 程式碼）：
    - 3 個 agent（偵察/撰稿/主編）、搜尋過去 24 小時、禁止虛構：lib/newsroom.ts scout()/write()
    - 主編查 2 項（grounded、quality_ok）：lib/newsroom.ts review()
    - 每天 00:00 UTC 排程：vercel.json
    - 排程預設 2 則候選；最佳 1 篇自動發布，其餘存草稿：app/api/ingest/route.ts、lib/ingest.ts
-->
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>AI 新聞編輯部 v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f5f2; --card: #fdfcfa; --ink: #1f2227; --ink-soft: #4b4f55;
    --ink-faint: #84888f; --seal: #c5392f; --seal-ink: #ffffff;
    --hairline: #e2dfd8; --hairline-strong: #c9c5bb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
    padding: 64px 72px 56px;
    display: flex; flex-direction: column;
  }
  .serif { font-family: "Noto Serif TC", serif; }

  .kicker { font-size: 26px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.08em;
            padding-bottom: 16px; border-bottom: 1px solid var(--hairline-strong); }
  h1 { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 84px; line-height: 1.15;
       margin-top: 32px; }
  h1 .accent { color: var(--seal); }
  .dek { font-size: 34px; line-height: 1.45; color: var(--ink-soft); margin-top: 24px; }

  .flow { margin-top: 48px; flex: 1; display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 200px 1fr; align-items: center;
          background: var(--card); border: 1px solid var(--hairline); border-radius: 4px;
          padding: 28px 32px; }
  .step .role { display: flex; flex-direction: column; gap: 0; }
  .step .no { font-size: 26px; font-weight: 500; color: var(--ink-faint); }
  .step .name { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 44px; line-height: 1.2; }
  .step p { font-size: 30px; line-height: 1.5; color: var(--ink); text-wrap: balance; }
  .step.final { padding: 36px 32px; border: 2px solid var(--ink); }
  .step.final p { font-weight: 500; }

  /* 連接線：從上一張卡底邊到下一張卡頂邊，箭頭尖端貼齊卡片 */
  .link { height: 40px; margin-left: 132px; position: relative; }
  .link svg { position: absolute; left: -9px; top: 0; }

  footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--hairline-strong);
           display: flex; justify-content: space-between; align-items: center; }
  .id { display: flex; align-items: center; gap: 16px; }
  .seal { width: 64px; height: 64px; border-radius: 4px; background: var(--seal); color: var(--seal-ink);
          font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 40px;
          display: flex; align-items: center; justify-content: center; }
  .id .brand { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 30px; line-height: 1.2; }
  .id .tag { font-size: 26px; color: var(--ink-faint); line-height: 1.3; }
  .src { font-size: 26px; color: var(--ink-faint); text-align: right; line-height: 1.35; }
</style>
</head>
<body>
  <div class="kicker">AI 工作流拆解 · VeNews 自動新聞編輯部</div>
  <h1>3 個 AI 編輯，<br>每天只放行 <span class="accent">1 篇</span></h1>
  <p class="dek">每天 00:00 UTC 自動開工，過了查證才上線。</p>

  <section class="flow">
    <div class="step">
      <div class="role"><span class="no">01</span><span class="name">偵察</span></div>
      <p>搜尋 24 小時內的 AI 新聞，每則附來源網址。</p>
    </div>
    <div class="link"><svg width="20" height="40" viewBox="0 0 20 40"><line x1="10" y1="0" x2="10" y2="30" stroke="#c9c5bb" stroke-width="2"/><path d="M3 29 L10 40 L17 29 Z" fill="#c9c5bb"/></svg></div>
    <div class="step">
      <div class="role"><span class="no">02</span><span class="name">撰稿</span></div>
      <p>讀原文改寫成繁中，不准虛構數字與引述。</p>
    </div>
    <div class="link"><svg width="20" height="40" viewBox="0 0 20 40"><line x1="10" y1="0" x2="10" y2="30" stroke="#c9c5bb" stroke-width="2"/><path d="M3 29 L10 40 L17 29 Z" fill="#c9c5bb"/></svg></div>
    <div class="step">
      <div class="role"><span class="no">03</span><span class="name">主編</span></div>
      <p>查來源根據與品質，任一項不過就退稿。</p>
    </div>
    <div class="link"><svg width="20" height="40" viewBox="0 0 20 40"><line x1="10" y1="0" x2="10" y2="30" stroke="#c9c5bb" stroke-width="2"/><path d="M3 29 L10 40 L17 29 Z" fill="#c9c5bb"/></svg></div>
    <div class="step final">
      <div class="role"><span class="no">04</span><span class="name">放行</span></div>
      <p>通過稿件中最重要的一篇自動上線，<br>其餘留成草稿，等人到後台決定。</p>
    </div>
  </section>

  <footer>
    <div class="id" data-brand="identity">
      <div class="seal" aria-hidden="true">聞</div>
      <div><div class="brand">VeNews 鳴新聞</div><div class="tag">每日要聞，值得慢讀。</div></div>
    </div>
    <div class="src">來源：VeNews 原始碼<br>lib/newsroom.ts、lib/ingest.ts</div>
  </footer>
</body>
</html>
